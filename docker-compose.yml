# Layanan produksi: PostgreSQL + Redis.
# Jalankan: docker compose up -d
# Untuk mode testing Windows tanpa Docker, file ini TIDAK dibutuhkan.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medibot}
      POSTGRES_USER: ${POSTGRES_USER:-medibot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-GANTI_PASSWORD_PRODUKSI}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medibot} -d ${POSTGRES_DB:-medibot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
