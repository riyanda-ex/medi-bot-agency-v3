name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  # Semua nilai di bawah adalah throwaway CI, BUKAN kunci produksi.
  # Jangan pernah mengisi ini dengan secret lingkungan nyata.
  CI: "true"
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: Zk9pQ2xVnM4dR7sY1uJ6hB3tK8wE5aN0cF2oL9zX4vU
  FIELD_ENCRYPTION_KEY: Vm8tR5xQ2pL7nB4sW1yK9dJ6hF3aN0cE8uZ1oX5vT7qR
  SYNC_MODE: "true"
  ALLOW_REAL_OUTBOUND: "false"
  REQUIRE_HUMAN_APPROVAL: "true"
  WHATSAPP_PROVIDER: mock
  PHONE_PROVIDER: mock
  QUEUE_MODE: sync
  # Seed destruktif hanya berjalan di development/test dengan konfirmasi ini.
  ALLOW_DESTRUCTIVE_SEED: "1"
  SEED_ADMIN_PASSWORD: Tn8wQ3xR6mV2kP9sY4dH7bJ1fL5cZ0aG
  E2E_PASSWORD: Tn8wQ3xR6mV2kP9sY4dH7bJ1fL5cZ0aG
  DATABASE_URL: "file:./dev.db"

jobs:
  verify-windows:
    name: Verifikasi Windows PowerShell
    runs-on: windows-latest
    steps:
      # Actions dipin ke commit; komentar menunjukkan tag rilisnya.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Pin npm sesuai packageManager
        run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:setup
      # tests/data-lifecycle.test.ts memeriksa skema PostgreSQL hasil generate;
      # buat file turunannya sebelum verify:all tanpa mengganti client SQLite.
      - run: node scripts/sync-postgres-schema.mjs
      - run: npm run verify:all
      - run: npm run test:ci
      - run: npm run openapi:check
      - run: npm run prisma:generate:pg
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('coverage/**') != ''
        with:
          name: coverage-windows
          path: coverage

  verify-services:
    name: Verifikasi PostgreSQL + Redis + E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medibot
          POSTGRES_USER: medibot
          POSTGRES_PASSWORD: medibot_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medibot -d medibot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medibot:medibot_ci_password@localhost:5432/medibot?schema=public
      REDIS_URL: redis://localhost:6379
      SYNC_MODE: "false"
      RATE_LIMIT_MODE: redis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Pin npm sesuai packageManager
        run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npm run prisma:generate:pg
      - run: npx prisma migrate deploy --config prisma/postgres.config.ts
      - run: npm run db:seed
      - run: npm run build
      - name: Jalankan server produksi
        run: |
          PORT=3000 nohup npm run start > server.log 2>&1 &
          echo $! > server.pid
      - name: Tunggu server siap
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          cat server.log
          exit 1
      - run: npm run e2e
      - name: Hentikan server
        if: always()
        run: kill $(cat server.pid) || true

  verify-redis-queue:
    name: Verifikasi worker BullMQ terpisah
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medibot
          POSTGRES_USER: medibot
          POSTGRES_PASSWORD: medibot_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medibot -d medibot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medibot:medibot_ci_password@localhost:5432/medibot?schema=public
      REDIS_URL: redis://localhost:6379
      SYNC_MODE: "false"
      QUEUE_MODE: redis
      RATE_LIMIT_MODE: redis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Pin npm sesuai packageManager
        run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npm run prisma:generate:pg
      - run: npx prisma migrate deploy --config prisma/postgres.config.ts
      - run: npm run db:seed
      - run: npm run build
      - name: Jalankan worker dan server
        run: |
          nohup npm run queue:worker > worker.log 2>&1 &
          echo $! > worker.pid
          PORT=3000 nohup npm run start > server.log 2>&1 &
          echo $! > server.pid
      - name: Tunggu worker dan server siap
        run: |
          for i in $(seq 1 30); do
            if grep -q '"event":"queue.worker.ready"' worker.log && curl -fsS http://localhost:3000/api/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          cat worker.log
          cat server.log
          exit 1
      - run: npm run queue:check
      - name: Hentikan proses
        if: always()
        run: |
          kill $(cat server.pid) || true
          kill $(cat worker.pid) || true
