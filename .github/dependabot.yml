version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # TypeScript >=6.1 belum didukung typescript-eslint, Prisma 7 butuh
    # migrasi prisma.config.ts/adapter. Keduanya ditangani manual.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "prisma"
        versions: [">=7.0.0"]
      - dependency-name: "@prisma/client"
        versions: [">=7.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
